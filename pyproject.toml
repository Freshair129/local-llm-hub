[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-llm-hub-runtime"
version = "0.1.0"
description = "Local-first model router and bounded agent runtime"
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai-slim==2.54.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
  "python-dotenv>=1,<2",
]

[project.scripts]
local-llm-hub = "local_llm_hub.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff", "mypy", "build", "types-PyYAML", "types-jsonschema"]

[tool.setuptools.packages.find]
where = ["runtime"]
include = ["local_llm_hub*"]

[tool.pytest.ini_options]
testpaths = ["runtime/tests"]
asyncio_mode = "auto"
markers = ["integration: opt-in live inference"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["runtime/local_llm_hub"]
